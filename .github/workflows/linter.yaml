name: Linter

on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  TYK_PMP_ANALYTICSSTORAGETYPE: redis
  TYK_PMP_ANALYTICSSTORAGECONFIG_TYPE: redis
  TYK_PMP_ANALYTICSSTORAGECONFIG_HOST: localhost
  TYK_PMP_ANALYTICSSTORAGECONFIG_PORT: 6379

jobs:
  gotest:
    name: Go Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [1.26]
    services:
      redis:
        image: redis:5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:4.2
        ports:
          - 27017:27017
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 # zizmor: ignore[cache-poisoning] test/lint job; the cache was already on before this PR
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] test/lint job; the cache was already on before this PR
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Go Test
        id: test
        run: |
          PKGS="$(go list ./...)"
          OPTS="-count=1 -failfast -v"
          GOTESTSUM="go run gotest.tools/gotestsum@v1.13.0"

          for pkg in ${PKGS}; do
              tags=""
              if [[ ${pkg} == *"goplugin" ]]; then
                  tags="--tags 'goplugin'"
              fi

              coveragefile=`echo "$pkg" | awk -F/ '{print $NF}'`

              echo go test ${OPTS} -json -timeout 15m -coverprofile=${coveragefile}.cov ${pkg} ${tags}

              ${GOTESTSUM} --junitfile ${coveragefile}.xml --raw-command go test ${OPTS} --json -timeout 15m -coverprofile=${coveragefile}.cov ${pkg} ${tags}
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: "*cov"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: junit
          path: "*xml"
      - name: Github report view
        if: ${{ always() }}
        uses: phoenix-actions/test-reporting@7317eea6e13c47348dd0bb318669485157c518d6 # v16
        with:
          name: Unit Test Results
          path: "*.xml"
          reporter: java-junit
  golangci:
    runs-on: ubuntu-latest
    needs: gotest
    if: ${{ always() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        timeout-minutes: 20
        with:
          version: v2.12.2
          only-new-issues: ${{ github.event_name == 'pull_request' }}
          # Output formats configured in .golangci.yaml (v2 approach)
          # Generates: text to stdout + checkstyle JSON for SonarQube
          args: --issues-exit-code=0 -v ./...
          skip-cache: false
          skip-save-cache: false
      - name: Upload golangci-lint report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: golangci-report
          retention-days: 1
          path: golanglint.xml
  generate-token:
    if: ${{ always() }}
    needs: [gotest, golangci]
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app-token.outputs.token }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0 # zizmor: ignore[github-app] owner-wide token, scoping tracked separately
        with:
          app-id: ${{ secrets.PROBE_APP_ID }}
          private-key: ${{ secrets.PROBE_APP_PRIVATE_KEY }}
          owner: TykTechnologies

  sonarcloud:
    if: ${{ always() }}
    needs: [gotest, golangci, generate-token]
    uses: TykTechnologies/github-actions/.github/workflows/sonarcloud.yaml@production
    with:
      exclusions: "analytics/proto/**/*.pb.go"
    secrets:
      GH_TOKEN: ${{ needs.generate-token.outputs.token }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
