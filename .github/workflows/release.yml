# yamllint disable rule:line-length rule:truthy
---
name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  schedule:
    - cron: "0 0 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - master
      - release-**
    tags:
      - 'v*'

jobs:
  release:
    uses: TykTechnologies/github-actions/.github/workflows/release-common.yml@TT-18139-releng-poc
    secrets: inherit
    permissions:
      id-token: write   # AWS OIDC
      contents: read    # actions/checkout
    with:
      repo_name: tyk-pump
      upgrade_repo: tyk-pump
      golang_cross: 1.26-bookworm
      cgo: '0'
      platforms_std: 'linux/amd64,linux/arm64'
      dockerhub_std: tykio/tyk-pump-docker-pub
      dockerhub_fips: tykio/tyk-pump-fips
      cloudsmith_std: docker.tyk.io/tyk-pump/tyk-pump
      image_title: Tyk Analytics Pump
      image_description: 'Tyk Analytics Pump to move analytics data from Redis to any supported back end (multiple back ends can be written to at once).'
      build_fips: true
      run_api_tests: true
