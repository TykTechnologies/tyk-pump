services:
  redis:
    image: redis:5
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb:
    image: mongo:4.2
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: tyk_analytics
      POSTGRES_USER: tyk
      POSTGRES_PASSWORD: tyk123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tyk -d tyk_analytics -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tyk_analytics
      MYSQL_USER: tyk
      MYSQL_PASSWORD: tyk123
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
