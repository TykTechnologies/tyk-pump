global:
  scrape_interval: 2s

scrape_configs:
  - job_name: otel-collector
    # The collector's Prometheus exporter turns service.name / service.instance.id
    # into job / instance. honor_labels keeps those OTel identities instead of
    # overwriting them with the scrape target's and renaming the originals to
    # exported_job / exported_instance. This is the setup the OpenTelemetry
    # docs recommend for scraping a collector.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
