# yamllint disable rule:line-length
---
# End-to-end OpenTelemetry metrics stack for the Pump:
#
#   go test --HTTP--> tyk-gateway --analytics--> redis --> tyk-pump --> mongo, ...
#   tyk-pump --OTLP/gRPC--> otel-collector --/metrics--> prometheus <-- go test
#
# redis is the temporal storage; mongo backs the Mongo uptime pump (default
# profile) and the pumps profile's mongo pump, and postgres the SQL uptime pump
# (postgres profile). The Gateway (OSS, two keyless APIs from
# configs/gateway/apps) is the real traffic source for the pumps, decode and
# pump-disabled profiles, so records reach Redis in the Gateway's own encoding.
# Each is behind compose profiles named after the PUMP_PROFILE values that need
# it, so the other profiles never start or wait for it (the Taskfile sets
# COMPOSE_PROFILES). The health suite stops, pauses and restarts the datastores
# to drive tyk.pump.health; the pumps suite pauses mongo to make its pump time
# out.
#
# The Pump is configured only through environment variables (configs/pump.env
# plus the per-profile env file), so the same TYK_PMP_OPENTELEMETRY_METRICS_*
# surface operators use is what gets exercised. Select a profile with
# PUMP_PROFILE (default: default).
services:
  redis:
    image: redis:6-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 60

  mongo:
    image: mongo:7.0
    profiles: ["default", "pumps"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:15-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: tyk
      POSTGRES_PASSWORD: tyk
      POSTGRES_DB: tyk_analytics
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tyk", "-d", "tyk_analytics"]
      interval: 1s
      timeout: 3s
      retries: 60

  tyk-gateway:
    image: ${GATEWAY_IMAGE:-tykio/tyk-gateway:v5.14.0}
    profiles: ["pumps", "decode", "pump-disabled"]
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      # The image's tyk.conf already points at the "redis" service and loads
      # API definitions from /opt/tyk-gateway/apps.
      TYK_GW_ENABLEANALYTICS: "true"
      TYK_GW_LOGLEVEL: "info"
    volumes:
      - ./configs/gateway/apps:/opt/tyk-gateway/apps:ro
    depends_on:
      redis:
        condition: service_healthy

  tyk-pump:
    image: ${PUMP_IMAGE:-internal/tyk-pump}
    ports:
      - "${PUMP_HEALTH_PORT:-8083}:8083"
    env_file:
      - ./configs/pump.env
      - ./profiles/${PUMP_PROFILE:-default}/pump.env
    depends_on:
      redis:
        condition: service_healthy
      # The uptime pump and the pumps profile's mongo pump connect at Init and
      # exit if they cannot.
      mongo:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      otel-collector:
        condition: service_started

  # The Pump image has no curl; healthcheck it from a sidecar so
  # `docker compose up --wait` blocks until /health answers.
  pump-checker:
    image: badouralix/curl-jq
    command: tail -f /dev/null
    depends_on:
      - tyk-pump
    healthcheck:
      test: curl -s --fail http://tyk-pump:8083/health | jq --exit-status '.status=="ok"' > /dev/null || exit 1
      interval: 2s
      timeout: 10s
      retries: 45
      start_period: 5s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command:
      - --config
      - /etc/otelcol/config.yml
    volumes:
      - ./configs/otelcollector/collector.config.yml:/etc/otelcol/config.yml:ro

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 2s
      timeout: 3s
      retries: 30
